# Auto-clip configuratie
language: en              # null = automatisch detecteren
content_type: auto        # auto | podcast | interview | gaming | vlog | educational | general
whisper_model: small      # tiny | base | small | medium | large-v3
clips: 5
min_duration: 15          # seconden
max_duration: 60
platform: tiktok          # tiktok | youtube | instagram

llm:
  model: claude-sonnet-5-5   # API-sleutel via env ANTHROPIC_API_KEY; zonder sleutel -> heuristiek

video:
  width: 1080
  height: 1920
  fps: 30
  face_tracking: true
  layout: crop           # crop (rond gezicht) | fit_blur (gameplay: scherp midden, wazige achtergrond)
  zoom: 0.05             # punch-in per tweede segment (0 = uit)
  progress_bar: true
  remove_fillers: true   # um / uh / er wegknippen
  tighten_pauses: true
  max_pause: 0.5         # seconden

captions:
  font: Arial
  size: 84
  primary_color: "#FFFFFF"
  highlight_color: "#FFE600"
  outline_color: "#000000"
  outline: 6
  words_per_line: 3
  margin_bottom: 420     # veilige zone onder (UI van TikTok/Shorts)
  uppercase: true

# Eigen overrides per videotype (bovenop de ingebouwde profielen), bv.:
# profiles:
#   gaming:
#     captions: {words_per_line: 1, size: 110}
